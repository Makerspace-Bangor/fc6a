<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000"><rect width="1280" height="1000" fill="white"/>
<text x="40" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#234331">ZNX package structure</text>
<text x="40" y="88" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#234331">IDEC HG2J / Linux HMI  |  Nested components and ZNV constituent legend</text>
<rect x="40" y="124" width="690" height="812" fill="#eff8ef" stroke="#78a184" stroke-width="1.5"/>
<text x="62" y="165" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#234331">ZNX PACKAGE</text>
<rect x="62" y="189" width="646" height="116" fill="#dcedd9" stroke="#78a184" stroke-width="1.5"/>
<text x="80" y="220" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#234331">Header + member directory</text>
<text x="80" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#234331">Names, types, offsets, sizes and IDEC XOR32 checksums</text>
<text x="80" y="273" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#234331">The former &quot;mystery bits&quot; are checksum fields.</text>
<rect x="62" y="325" width="646" height="100" fill="#d5eccc" stroke="#78a184" stroke-width="1.5"/>
<text x="80" y="360" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#234331">os_update.tar.xz</text>
<text x="80" y="392" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#234331">Linux / HMI OS update archive</text>
<rect x="62" y="445" width="646" height="465" fill="#e2f2dc" stroke="#78a184" stroke-width="1.5"/>
<text x="80" y="482" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#234331">project.znv</text>
<text x="80" y="510" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#234331">Nested ZNV container</text>
<rect x="80" y="532" width="610" height="67" fill="#cfe6c6" stroke="#78a184" stroke-width="1.5"/>
<text x="95" y="560" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#234331">ZNV header + member directory</text>
<text x="95" y="584" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">Per-member offsets, sizes and XOR32 checksums</text>
<rect x="80" y="615" width="610" height="132" fill="#d9edcf" stroke="#78a184" stroke-width="1.5"/>
<text x="95" y="643" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#234331">Compiled project records</text>
<text x="95" y="672" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">PROJECT.t2f / .p2f / .q2f / .d2f</text>
<text x="95" y="694" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">bsNNNN.o2f  /  mgNNNN.m2f</text>
<text x="95" y="716" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">PROJECT.b2f / .i2f / .e2f / .s2f / .l2f / .u2f</text>
<rect x="80" y="763" width="610" height="49" fill="#d2e8c7" stroke="#78a184" stroke-width="1.5"/>
<text x="95" y="792" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#234331">DRIVERn.G2F  |  Communication drivers</text>
<rect x="80" y="828" width="610" height="62" fill="#c3dfb8" stroke="#78a184" stroke-width="1.5"/>
<text x="95" y="856" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#234331">HG2F.BIN</text>
<text x="95" y="879" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">HMI runtime executable  |  ELF 32-bit ARM</text>
<rect x="762" y="124" width="478" height="812" fill="#fafcf9" stroke="#c5d4c7" stroke-width="1.5"/>
<text x="784" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#234331">ZNV constituent legend</text>
<text x="784" y="209" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#234331">PROJECT.t2f</text>
<text x="784" y="235" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">Project data, identity and settings.</text>
<text x="784" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#234331">PROJECT.p2f / PROJECT.q2f</text>
<text x="784" y="296" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">Project settings / network settings.</text>
<text x="784" y="331" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#234331">PROJECT.d2f</text>
<text x="784" y="357" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">Device/tag metadata; observed gzip stream</text>
<text x="784" y="379" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">contains TagInfo XML.</text>
<text x="784" y="414" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#234331">bsNNNN.o2f</text>
<text x="784" y="440" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">Compiled base-screen records.</text>
<text x="784" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#234331">mgNNNN.m2f</text>
<text x="784" y="501" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">Message and text records.</text>
<text x="784" y="536" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#234331">DRIVERn.G2F</text>
<text x="784" y="562" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">External-device communication drivers.</text>
<text x="784" y="597" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#234331">HG2F.BIN</text>
<text x="784" y="623" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">ARM executable for the HMI runtime.</text>
<text x="784" y="658" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#234331">.b2f / .i2f / .e2f / .s2f / .l2f / .u2f</text>
<text x="784" y="684" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">Project-support records; exact roles unresolved.</text>
<text x="784" y="719" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#234331">Feature-dependent records</text>
<text x="784" y="745" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">Recipes (.f2f), pictures (.j2f/.k2f),</text>
<text x="784" y="767" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#234331">MQTT (.mqt) and fonts (.bin) may also occur.</text>
<text x="40" y="967" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#53665a">Logical grouping; not to scale. Record sets vary by project. Source: project reference (4 Oct 2026) and checksum notes (5 Oct 2026).</text>
</svg>